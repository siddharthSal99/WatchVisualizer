<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Watch strap top -->
  <rect x="22" y="2" width="20" height="14" rx="3" fill="#555"/>
  <!-- Watch strap bottom -->
  <rect x="22" y="48" width="20" height="14" rx="3" fill="#555"/>
  <!-- Watch case -->
  <circle cx="32" cy="32" r="20" fill="#c0c0c0" stroke="#999" stroke-width="2"/>
  <!-- Bezel -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Dial -->
  <circle cx="32" cy="32" r="15" fill="#1a1a2e"/>
  <!-- Hour markers -->
  <line x1="32" y1="19" x2="32" y2="22" stroke="#e0d68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="42" x2="32" y2="45" stroke="#e0d68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="32" x2="22" y2="32" stroke="#e0d68a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="32" x2="45" y2="32" stroke="#e0d68a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing ~10) -->
  <line x1="32" y1="32" x2="26" y2="23" stroke="#e0d68a" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing ~2) -->
  <line x1="32" y1="32" x2="39" y2="21" stroke="#e0d68a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="1.5" fill="#e0d68a"/>
  <!-- Crown -->
  <rect x="51" y="29" width="5" height="6" rx="1.5" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
</svg>

